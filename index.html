<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Isaiah Builds</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  html, body { margin: 0; height: 100%; background: #1d2b3a; font-family: "Trebuchet MS", Arial, sans-serif; overflow: hidden; }
  #wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  h1 { margin: 0; color: #ffd84d; font-size: 28px; letter-spacing: 1px; text-shadow: 2px 2px 0 #b8560b; }
  canvas { background: #87ceeb; border: 4px solid #ffd84d; border-radius: 8px; max-width: 96vw; max-height: 78vh; cursor: crosshair; image-rendering: pixelated; }
  #help { color: #dbe7f3; font-size: 14px; text-align: center; line-height: 1.7; }
  html, body, canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  /* On a touch screen (iPad) give the game the whole screen */
  body.touch h1, body.touch #help { display: none; }
  body.touch canvas { max-width: 100vw; max-height: 100vh; max-height: 100dvh; border-width: 2px; border-radius: 0; }
  kbd { background: #33475b; padding: 1px 6px; border-radius: 4px; border: 1px solid #55708a; }
</style>
</head>
<body>
<div id="wrap">
  <h1>ISAIAH BUILDS</h1>
  <canvas id="game" width="960" height="540"></canvas>
  <div id="help">
    <kbd>A</kbd><kbd>D</kbd> or arrows to move &nbsp; <kbd>Space</kbd> jump / swim up / let go of a vine &nbsp;
    <b>Left click</b> build &nbsp; <b>Right click</b> (or <kbd>X</kbd>) break &nbsp; <kbd>1</kbd>-<kbd>9</kbd> pick block<br>
    <kbd>V</kbd> choose what to make &nbsp; <kbd>C</kbd> make it where the mouse is &nbsp; <kbd>R</kbd> new world<br>
    Walk into a hanging vine to grab it, then <kbd>A</kbd><kbd>D</kbd> to pump and swing
  </div>
</div>
<script>
/* ============================================================
   ISAIAH'S SETTINGS  -  change a number or a color, save the
   file, then refresh the browser to see what happens!
   ============================================================ */
var ISAIAH = {
  // How fast the builder walks. Try 6 for super speed!
  walkSpeed: 3.2,

  // How high the builder jumps. Try 16 for a giant jump!
  jumpPower: 10.5,

  // How strongly the world pulls you down. Try 0.2 for moon gravity!
  gravity: 0.55,

  // How far away you can build, counted in blocks.
  buildReach: 6,

  // Colors of the builder (any color name or #ff00ff style code)
  shirtColor: "#2f80ed",
  hatColor: "#ffd84d",

  // The sky, from top to bottom. Try "#1a0033" and "#6a0dad" for a night sky!
  skyTop: "#5aa9e6",
  skyBottom: "#bfe6ff",

  // Your nine blocks. Change the name or the color, or invent a new one!
  blockNames:  ["Grass", "Dirt", "Stone", "Wood", "Brick", "Glass", "Water", "Trunk", "Leaves"],
  blockColors: ["#5cb85c", "#8b5a2b", "#8a8f98", "#c98f4a", "#c1440e", "rgba(160,220,255,0.55)", "rgba(30,110,220,0.55)", "#7a5230", "#4a8f3c"],

  // How many of each living thing start in the world. Try 30 fish!
  howManyBunnies: 5,
  howManyFish: 10,
  howManyBirds: 4,
  howManyTurtles: 4,
  howManyCrocodiles: 2,

  // How many trees grow when a brand new world is made.
  howManyTrees: 3,

  // How tall a tree is (in blocks) and how long its vine hangs (in blocks).
  treeHeight: 5,
  vineLength: 4,

  // Colors of the living things
  bunnyColor: "#f4f1ea",
  fishColor: "#ff8c1a",
  birdColor: "#e63946",
  turtleColor: "#4c9a52",
  crocodileColor: "#3f6b3a"
};

(function () {
  "use strict";
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = canvas.width, H = canvas.height;
  var T = 32;               // tile size in pixels
  var COLS = 80, ROWS = 32; // world size in tiles
  var GROUND = 20;          // the top of the island
  var SEABED = GROUND + 6;  // the floor of the sea
  var REACH = ISAIAH.buildReach; // how far (in tiles) the player can build
  var WATER = 7;             // block number of water
  var TRUNK = 8, LEAVES = 9; // block numbers of a tree's trunk and leaves
  var NUM_BLOCKS = 9;

  // Block types. 0 is empty air.
  var BLOCKS = [
    null,
    { name: ISAIAH.blockNames[0], color: ISAIAH.blockColors[0], top: "#3d9a3d" },
    { name: ISAIAH.blockNames[1], color: ISAIAH.blockColors[1], top: "#734a22" },
    { name: ISAIAH.blockNames[2], color: ISAIAH.blockColors[2], top: "#6f747c" },
    { name: ISAIAH.blockNames[3], color: ISAIAH.blockColors[3], top: "#a8733a" },
    { name: ISAIAH.blockNames[4], color: ISAIAH.blockColors[4], top: "#8f300a" },
    { name: ISAIAH.blockNames[5], color: ISAIAH.blockColors[5], top: "rgba(255,255,255,0.8)" },
    { name: ISAIAH.blockNames[6], color: ISAIAH.blockColors[6], top: "rgba(255,255,255,0.6)" },
    { name: ISAIAH.blockNames[7], color: ISAIAH.blockColors[7], top: "#5a3a1e" },
    { name: ISAIAH.blockNames[8], color: ISAIAH.blockColors[8], top: "#3f7d32" }
  ];

  var world = [];
  var SAVE_KEY = "isaiah-builds-world-v3";

  function rand(a, b) { return a + Math.random() * (b - a); }

  // Stamp a tree's trunk and leaf blocks into a grid, above the given ground row.
  // Returns the row of the top trunk tile on success, or -1 if there is no room.
  function stampTree(w, tx, groundY) {
    var trunkH = Math.max(3, Math.round(ISAIAH.treeHeight || 5));
    var topY = groundY - trunkH;
    if (topY < 1 || tx < 1 || tx > COLS - 2) return -1;
    var i;
    for (i = topY; i < groundY; i++) if (w[i][tx] !== 0) return -1;
    for (i = topY; i < groundY; i++) w[i][tx] = TRUNK;
    var cy = topY - 1;
    if (cy >= 0) {
      w[cy][tx] = LEAVES;
      if (tx - 1 >= 0 && w[cy][tx - 1] === 0) w[cy][tx - 1] = LEAVES;
      if (tx + 1 < COLS && w[cy][tx + 1] === 0) w[cy][tx + 1] = LEAVES;
      if (cy - 1 >= 0 && w[cy - 1][tx] === 0) w[cy - 1][tx] = LEAVES;
    }
    return topY;
  }

  // An island in the middle of the world, surrounded by water.
  function freshWorld() {
    var w = [], x, y;
    for (y = 0; y < ROWS; y++) {
      var row = [];
      for (x = 0; x < COLS; x++) row.push(0);
      w.push(row);
    }
    var center = COLS / 2, halfWidth = 18;
    for (x = 0; x < COLS; x++) {
      var d = Math.abs(x + 0.5 - center) / halfWidth;
      var top;
      if (d < 0.7) top = GROUND;                                            // flat top of the island
      else if (d >= 1) top = SEABED;                                        // the sea floor
      else top = Math.min(SEABED, GROUND + Math.ceil((d - 0.7) / 0.3 * (SEABED - GROUND))); // the beach slopes down
      // water fills everything above the ground, from just below the island top
      for (y = GROUND + 1; y < top; y++) w[y][x] = WATER;
      // ground
      for (y = top; y < ROWS; y++) {
        var depth = y - top;
        if (depth === 0) w[y][x] = (top <= GROUND + 1) ? 1 : 2;   // grass on land, dirt under the sea
        else if (depth <= 2) w[y][x] = 2;
        else w[y][x] = 3;
      }
    }
    // plant a few starting trees on the island
    var treeCount = ISAIAH.howManyTrees || 0, placed = 0, attempts = 0, ttx, gy;
    while (placed < treeCount && attempts < 50) {
      attempts++;
      ttx = Math.floor(rand(center - halfWidth * 0.6, center + halfWidth * 0.6));
      gy = 0; while (gy < ROWS && w[gy][ttx] === 0) gy++;
      if (gy < ROWS && w[gy][ttx] === 1 && stampTree(w, ttx, gy) >= 0) placed++;
    }
    return w;
  }

  function saveWorld() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(world)); } catch (e) {}
  }
  function loadWorld() {
    try {
      var s = localStorage.getItem(SAVE_KEY);
      if (s) {
        var w = JSON.parse(s);
        if (w && w.length === ROWS && w[0].length === COLS) return w;
      }
    } catch (e) {}
    return null;
  }
  world = loadWorld() || freshWorld();

  function blockAt(tx, ty) {
    if (tx < 0 || tx >= COLS) return 3;      // invisible walls at the sides
    if (ty < 0) return 0;
    if (ty >= ROWS) return 3;
    return world[ty][tx];
  }
  function solidAt(tx, ty) {
    var b = blockAt(tx, ty);
    return b !== 0 && b !== WATER && b !== LEAVES;   // you can walk through air, water and leaves
  }

  // Player
  var player = { x: (COLS / 2) * T, y: (GROUND - 3) * T, w: 22, h: 44, vx: 0, vy: 0, onGround: false, facing: 1, onVine: null, vineCooldown: 0, vineBoost: 0 };
  var selected = 1;
  var jumpBuffer = 0;
  var lastResetPress = 0;
  var keys = {};
  var mouse = { x: 0, y: 0 };
  var cam = { x: 0, y: 0 };
  var tick = 0;
  var clouds = [];
  for (var c = 0; c < 10; c++) clouds.push({ x: Math.random() * COLS * T, y: 30 + Math.random() * 180, s: 0.6 + Math.random() * 0.9 });

  // ---------------------------------------------------------------
  // LIVING THINGS
  // Each kind says where it lives and how big it is.
  // ---------------------------------------------------------------
  var KINDS = {
    bunny:     { name: "Bunny",     w: 22, h: 18 },
    fish:      { name: "Fish",      w: 22, h: 12 },
    bird:      { name: "Bird",      w: 20, h: 14 },
    turtle:    { name: "Turtle",    w: 24, h: 14 },
    crocodile: { name: "Crocodile", w: 40, h: 16 },
    tree:      { name: "Tree",      w: 26, h: 6 }
  };
  var KIND_LIST = ["bunny", "fish", "bird", "turtle", "crocodile", "tree"];
  var chosenKind = 0;
  var creatures = [];
  var MAX_CREATURES = 90;
  var message = "", messageTimer = 0;

  function say(text) { message = text; messageTimer = 120; }

  function makeCreature(kind, x, y) {
    var k = KINDS[kind];
    return { kind: kind, x: x, y: y, w: k.w, h: k.h, vx: 0, vy: 0, dir: Math.random() < 0.5 ? -1 : 1,
             timer: 0, onGround: false, base: y, phase: Math.random() * 6 };
  }

  // Are all the tiles under this box water?
  function allWater(x, y, w, h) {
    var x0 = Math.floor(x / T), x1 = Math.floor((x + w - 0.001) / T);
    var y0 = Math.floor(y / T), y1 = Math.floor((y + h - 0.001) / T);
    for (var ty = y0; ty <= y1; ty++)
      for (var tx = x0; tx <= x1; tx++)
        if (blockAt(tx, ty) !== WATER) return false;
    return true;
  }

  function spawnStartingCreatures() {
    var i, tries, x, y;
    creatures = [];
    for (i = 0; i < ISAIAH.howManyBunnies; i++) {
      x = (COLS / 2 + rand(-9, 9)) * T;
      creatures.push(makeCreature("bunny", x, (GROUND - 2) * T));
    }
    for (i = 0; i < ISAIAH.howManyFish; i++) {
      for (tries = 0; tries < 60; tries++) {
        x = rand(2, COLS - 3) * T; y = rand(GROUND + 2, SEABED - 1) * T;
        if (allWater(x, y, KINDS.fish.w, KINDS.fish.h)) { creatures.push(makeCreature("fish", x, y)); break; }
      }
    }
    for (i = 0; i < ISAIAH.howManyBirds; i++) {
      creatures.push(makeCreature("bird", rand(2, COLS - 3) * T, rand(3, 9) * T));
    }
    for (i = 0; i < ISAIAH.howManyTurtles; i++) {
      for (tries = 0; tries < 60; tries++) {
        x = rand(2, COLS - 3) * T; y = rand(GROUND - 2, SEABED) * T;
        if (!collides(x, y, KINDS.turtle.w, KINDS.turtle.h)) { creatures.push(makeCreature("turtle", x, y)); break; }
      }
    }
    for (i = 0; i < ISAIAH.howManyCrocodiles; i++) {
      for (tries = 0; tries < 60; tries++) {
        x = rand(2, COLS - 3) * T; y = rand(GROUND + 2, SEABED - 1) * T;
        if (allWater(x, y, KINDS.crocodile.w, KINDS.crocodile.h)) { creatures.push(makeCreature("crocodile", x, y)); break; }
      }
    }
  }
  spawnStartingCreatures();

  // ---------------------------------------------------------------
  // TREES AND VINES
  // ---------------------------------------------------------------
  var vines = [];

  function makeVineAt(tx, topY) {
    var side = vines.length % 2 === 0 ? 1 : -1;   // alternate which side the branch is on
    vines.push({
      ax: tx * T + T / 2 + side * T * 0.6,          // anchor x, out beside the trunk so it is easy to see
      ay: topY * T + T * 0.8,                       // anchor y
      len: Math.max(2, ISAIAH.vineLength || 4) * T, // how far it hangs, in pixels
      angle: 0, angVel: 0, grabbed: false, sway: Math.random() * 10
    });
  }

  // Look at the blocks already in the world and give every tree a vine.
  function rebuildVinesFromWorld() {
    vines = [];
    for (var x = 0; x < COLS; x++) {
      for (var y = 1; y < ROWS; y++) {
        if (world[y][x] === TRUNK && world[y - 1][x] !== TRUNK) { makeVineAt(x, y); break; }
      }
    }
  }
  rebuildVinesFromWorld();

  // Plant a tree at a spot in the world (in pixels), with a vine to swing from.
  function placeTreeAt(wx, wy) {
    var tx = Math.floor(wx / T);
    if (tx < 1 || tx > COLS - 2) { say("Too close to the edge of the world."); return; }
    var ty = Math.max(0, Math.floor(wy / T));
    while (ty < ROWS && world[ty][tx] === 0) ty++;
    if (ty >= ROWS || world[ty][tx] === WATER) { say("Trees need solid ground under them."); return; }
    var topY = stampTree(world, tx, ty);
    if (topY < 0) { say("Not enough room for a tree there."); return; }
    saveWorld();
    makeVineAt(tx, topY);
    say("A tree! Walk into the vine to grab it.");
  }

  function idleSwayVine(v) {
    v.sway += 0.02;
    v.angle = Math.sin(v.sway) * 0.12;
  }

  // Pendulum physics for the vine the player is holding.
  function swingVine(v) {
    var accel = -(0.9 / (v.len / T)) * Math.sin(v.angle);
    var left = keys["a"] || keys["arrowleft"] || touch.left;
    var right = keys["d"] || keys["arrowright"] || touch.right;
    if (left) accel -= 0.012;
    if (right) accel += 0.012;
    v.angVel += accel;
    v.angVel *= 0.998;
    v.angle += v.angVel;

    var tipX = v.ax + Math.sin(v.angle) * v.len, tipY = v.ay + Math.cos(v.angle) * v.len;
    player.x = tipX - player.w / 2;
    player.y = tipY - player.h + 8;
    player.vx = Math.cos(v.angle) * v.angVel * v.len;
    player.vy = -Math.sin(v.angle) * v.angVel * v.len;
    if (Math.abs(player.vx) > 0.3) player.facing = player.vx > 0 ? 1 : -1;

    var jumpPressed = keys[" "] || keys["w"] || keys["arrowup"] || touch.jump;
    if (jumpPressed) { v.grabbed = false; player.onVine = null; player.vineCooldown = 15; player.onGround = false; player.vineBoost = 16; }
  }

  // Make a living thing where the mouse points
  function spawnAtMouse() { spawnAt(mouse.x + cam.x, mouse.y + cam.y); }
  // Make a living thing (or a tree) centered on a spot in the world (in pixels)
  function spawnAt(wx, wy) {
    var kind = KIND_LIST[chosenKind];
    if (kind === "tree") { placeTreeAt(wx, wy); return; }
    if (creatures.length >= MAX_CREATURES) { say("That is a lot of animals! No more room."); return; }
    var x = wx - KINDS[kind].w / 2, y = wy - KINDS[kind].h / 2;
    if (kind === "fish" && !allWater(x, y, KINDS.fish.w, KINDS.fish.h)) { say("Fish need water! Point at the water."); return; }
    if (kind === "crocodile" && !allWater(x, y, KINDS.crocodile.w, KINDS.crocodile.h)) { say("Crocodiles live in the water! Point at the water."); return; }
    if (kind === "bird" && allWater(x, y, KINDS.bird.w, KINDS.bird.h)) { say("Birds fly in the sky. Point above the water."); return; }
    if (kind !== "fish" && kind !== "crocodile" && collides(x, y, KINDS[kind].w, KINDS[kind].h)) { say("No room there. Try an empty spot."); return; }
    creatures.push(makeCreature(kind, x, y));
  }

  function updateCreature(a) {
    var g;
    if (a.kind === "bunny") {
      a.timer--;
      if (a.timer <= 0) { a.dir = [-1, 0, 1][Math.floor(Math.random() * 3)]; a.timer = 40 + Math.floor(Math.random() * 90); }
      var inWater = blockAt(Math.floor((a.x + a.w / 2) / T), Math.floor((a.y + a.h / 2) / T)) === WATER;
      a.vx = a.dir * 0.8;
      if (a.onGround && a.dir !== 0 && Math.random() < 0.02) a.vy = -6.5;  // little hop
      // do not walk off into the water on purpose
      if (a.onGround && a.dir !== 0) {
        var frontX = Math.floor((a.x + (a.dir > 0 ? a.w + 4 : -4)) / T);
        var footY = Math.floor((a.y + a.h + 2) / T);
        if (blockAt(frontX, footY) === WATER || blockAt(frontX, footY) === 0) { a.dir = -a.dir; a.vx = 0; }
      }
      a.x += a.vx;
      if (collides(a.x, a.y, a.w, a.h)) { a.x -= a.vx; a.dir = -a.dir; }
      g = inWater ? 0.1 : 0.5;
      a.vy += g;
      if (inWater) a.vy = Math.max(-2, a.vy - 0.6);   // bunnies paddle up
      if (a.vy > 10) a.vy = 10;
      a.y += a.vy; a.onGround = false;
      if (collides(a.x, a.y, a.w, a.h)) {
        if (a.vy > 0) { a.y = Math.floor((a.y + a.h) / T) * T - a.h; a.onGround = true; }
        else { a.y = Math.floor(a.y / T) * T + T; }
        a.vy = 0;
      }
    } else if (a.kind === "fish") {
      a.timer--;
      if (a.timer <= 0) { a.timer = 60 + Math.floor(Math.random() * 100); a.vy = rand(-0.4, 0.4); if (Math.random() < 0.3) a.dir = -a.dir; }
      var nx = a.x + a.dir * 0.9;
      if (allWater(nx, a.y, a.w, a.h)) a.x = nx; else a.dir = -a.dir;
      var ny = a.y + a.vy;
      if (allWater(a.x, ny, a.w, a.h)) a.y = ny; else a.vy = -a.vy;
    } else if (a.kind === "bird") {
      a.phase += 0.08;
      a.x += a.dir * 1.3;
      a.y = a.base + Math.sin(a.phase) * 18;
      if (a.x < 0) { a.x = 0; a.dir = 1; }
      if (a.x > COLS * T - a.w) { a.x = COLS * T - a.w; a.dir = -1; }
    } else if (a.kind === "turtle") {
      a.timer--;
      if (a.timer <= 0) { a.dir = [-1, 0, 1][Math.floor(Math.random() * 3)]; a.timer = 60 + Math.floor(Math.random() * 120); }
      var turtleInWater = blockAt(Math.floor((a.x + a.w / 2) / T), Math.floor((a.y + a.h / 2) / T)) === WATER;
      var spd = turtleInWater ? 0.55 : 0.3;
      var tnx = a.x + a.dir * spd;
      if (!collides(tnx, a.y, a.w, a.h)) a.x = tnx; else a.dir = -a.dir;
      g = turtleInWater ? 0.08 : 0.5;
      a.vy += g;
      if (turtleInWater) a.vy = Math.max(-1.5, a.vy - 0.5); // gentle paddle
      if (a.vy > 8) a.vy = 8;
      a.y += a.vy; a.onGround = false;
      if (collides(a.x, a.y, a.w, a.h)) {
        if (a.vy > 0) { a.y = Math.floor((a.y + a.h) / T) * T - a.h; a.onGround = true; }
        else { a.y = Math.floor(a.y / T) * T + T; }
        a.vy = 0;
      }
    } else if (a.kind === "crocodile") {
      a.timer--;
      if (a.timer <= 0) { a.timer = 90 + Math.floor(Math.random() * 120); a.vy = rand(-0.15, 0.15); if (Math.random() < 0.25) a.dir = -a.dir; }
      var ncx = a.x + a.dir * 0.6;
      if (allWater(ncx, a.y, a.w, a.h)) a.x = ncx; else a.dir = -a.dir;
      var ncy = a.y + a.vy;
      if (allWater(a.x, ncy, a.w, a.h)) a.y = ncy; else a.vy = -a.vy;
    }
  }

  function drawCreature(a) {
    var sx = Math.round(a.x - cam.x), sy = Math.round(a.y - cam.y);
    if (sx < -50 || sx > W + 50 || sy < -50 || sy > H + 50) return;
    var f = a.dir === 0 ? 1 : a.dir;
    if (a.kind === "bunny") {
      var hx = f > 0 ? 14 : 0;
      ctx.fillStyle = ISAIAH.bunnyColor;
      ctx.fillRect(sx, sy + 6, 22, 12);                 // body
      ctx.fillRect(sx + hx, sy + 2, 8, 10);             // head
      ctx.fillRect(sx + hx + 1, sy - 6, 3, 9);          // ears
      ctx.fillRect(sx + hx + 5, sy - 6, 3, 9);
      ctx.fillStyle = "#f4a9b8"; ctx.fillRect(sx + hx + 2, sy - 4, 1, 5); ctx.fillRect(sx + hx + 6, sy - 4, 1, 5);
      ctx.fillStyle = "#222"; ctx.fillRect(sx + hx + (f > 0 ? 5 : 2), sy + 5, 2, 2); // eye
      ctx.fillStyle = "#ffffff"; ctx.fillRect(f > 0 ? sx - 3 : sx + 20, sy + 9, 5, 5); // tail
    } else if (a.kind === "fish") {
      ctx.fillStyle = ISAIAH.fishColor;
      ctx.beginPath();
      ctx.ellipse(sx + 11, sy + 6, 9, 5, 0, 0, 7); ctx.fill();
      ctx.beginPath();                                  // tail
      var tx = f > 0 ? sx + 2 : sx + 20;
      ctx.moveTo(tx, sy + 6); ctx.lineTo(tx + (f > 0 ? -6 : 6), sy); ctx.lineTo(tx + (f > 0 ? -6 : 6), sy + 12); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.fillRect(sx + (f > 0 ? 16 : 4), sy + 4, 3, 3);

  function inReach(tx, ty) {

  // Hotbar layout

  function update() {

      ctx.lineWidth = 3;
      ctx.strokeStyle = ok ? "#ffffff" : "rgba(255,80,80,0.8)";
      ctx.strokeRect(Math.round(htx * T - cam.x) + 1.5, Math.round(hty * T - cam.y) + 1.5, T - 3, T - 3);
      ctx.lineWidth = 1;
    }

    // hotbar
    for (var s = 0; s < NUM_BLOCKS; s++) {
      var sx = barX + s * (SLOT + GAP);
      ctx.fillStyle = "rgba(20,30,45,0.7)"; ctx.fillRect(sx, barY, SLOT, SLOT);
      ctx.lineWidth = (s + 1 === selected) ? 4 : 2;
      ctx.strokeStyle = (s + 1 === selected) ? "#ffd84d" : "#8ea3b8";
      ctx.strokeRect(sx, barY, SLOT, SLOT);
      ctx.lineWidth = 1;
      ctx.save(); ctx.translate(sx + 10, barY + 10);
      drawBlock(s + 1, 0, 0, 1);
      ctx.restore();
      ctx.fillStyle = "#fff"; ctx.font = "bold 12px Arial"; ctx.fillText(String(s + 1), sx + 4, barY + 14);
    }
    ctx.fillStyle = "#fff"; ctx.font = "bold 14px Arial"; ctx.textAlign = "center";
    ctx.fillText(BLOCKS[selected].name, W / 2, barY - 8);

    // "what to make" label (top left) and messages
    ctx.textAlign = "left";
    if (!touch.active) {
      ctx.fillStyle = "rgba(20,30,45,0.6)"; ctx.fillRect(10, 10, 260, 28);
      ctx.fillStyle = "#fff"; ctx.font = "bold 14px Arial";
      ctx.fillText("Make: " + KINDS[KIND_LIST[chosenKind]].name + "  (V change, C make)", 18, 29);
    } else {
      drawTouchControls();
    }
    ctx.font = "bold 14px Arial";
    if (messageTimer > 0) {
      ctx.textAlign = "center"; ctx.fillStyle = "rgba(20,30,45,0.75)"; ctx.fillRect(W / 2 - 200, 50, 400, 30);
      ctx.fillStyle = "#ffd84d"; ctx.fillText(message, W / 2, 70); ctx.textAlign = "left";
    }
  }

  // expose a tiny hook for automated testing
  window.__isaiahBuilds = {
    state: function () { return { player: player, selected: selected, cam: cam }; },
    world: function () { return world; },
    creatures: function () { return creatures; },
    vines: function () { return vines; },
    setKind: function (k) { chosenKind = KIND_LIST.indexOf(k); },
    spawnAt: function (wx, wy) { spawnAt(wx, wy); },
    T: T
  };

  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loop();
})();
</script>
</body>
</html>
